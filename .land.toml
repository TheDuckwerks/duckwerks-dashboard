# .land.toml -- dash's project manifest. The org `land` ritual (config/skills/land)
# reads most of it; the SessionStart hook reads [project].spine. The tools hold the
# mechanism, this holds dash's facts. Empty = skip that beat.

[project]
name    = "duckwerks-dashboard"
tracker = "TheDuckwerks/duckwerks-dashboard"
# README is the public portfolio front page, so the agent's read-first doc is the
# docs landing. The SessionStart hook points a cold session here instead of README.md.
spine   = "docs/index.md"

[version]
command = "npm version {level} --no-git-tag-version"
# Also bump APP_VERSION in public/v2/js/config.js -- the sidebar reads it.
# Patch every land that ships something; tag minor/major only, never per patch.

[log]
mode = "manual"
file = "docs/session-log.md"
command = ""

[docs]
regen = ""
build = ""

[lint]
command = "gander --doc projects/duckwerks-dashboard/AGENTS.md"

[deploy]
docs = ""
app  = "/Users/Shared/duckwerks/projects/duckwerks-ops/infra-scripts/ship duckwerks"
